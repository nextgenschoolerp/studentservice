spring:
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true
  application:
    name: studentservice
  # Student photos (5 MB) and documents (10 MB): StudentFileController
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authservice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8084}
  servlet:
    # All endpoints are served under http://localhost:8084/studentservice (e.g. /studentservice/api/v1/students)
    context-path: ${SERVER_CONTEXT_PATH:/studentservice}

jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  expiration: ${JWT_EXPIRATION:1800000}

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      consume: [w3c, b3]
      produce: [w3c, b3]

logging:
  level:
    root: info
    com.kvs: debug
    com.kvs.core.logging.RequestAndRepositoryLoggingAspect: debug
    org.springframework.security: debug

student:
  # Student photo and document files (StudentFileStorage); git-ignored
  file-vault:
    base-path: ${STUDENT_VAULT_PATH:./student-vault}
